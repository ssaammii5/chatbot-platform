name: chatbot-platform

services:
  # ==========================================
  # 1. CORE INFRASTRUCTURE
  # ==========================================
  postgres:
    image: pgvector/pgvector:pg18
    container_name: acp-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8.6-alpine
    container_name: acp-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--raw", "incr", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

  # ==========================================
  # 2. AI MICROSERVICE (FastAPI)
  # ==========================================
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile.dev
    container_name: acp-ai-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - AI_PROVIDER=${AI_PROVIDER:-openai}
      - AI_API_KEY=${AI_API_KEY}
      - AI_EMBEDDING_MODEL=${AI_EMBEDDING_MODEL:-text-embedding-3-small}
      - AI_CHAT_MODEL=${AI_CHAT_MODEL:-gpt-4o-mini}
      - RAG_TOP_K=${RAG_TOP_K:-5}
      - RAG_MAX_TOKENS=${RAG_MAX_TOKENS:-1024}
    volumes:
      - ./ai-service:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./ai-service/src
          target: /app/src
        - action: rebuild
          path: ./ai-service/requirements.txt

  # ==========================================
  # 3. BACKEND & WORKERS (NestJS + BullMQ)
  # ==========================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: acp-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - JWT_SECRET=${JWT_SECRET}
      - OAUTH2_ISSUER=${OAUTH2_ISSUER}
      - OAUTH2_CLIENT_ID=${OAUTH2_CLIENT_ID}
      - OAUTH2_CLIENT_SECRET=${OAUTH2_CLIENT_SECRET}
      - RATE_LIMIT_GLOBAL_RPM=${RATE_LIMIT_GLOBAL_RPM:-1000}
      - RATE_LIMIT_TENANT_TOKENS_PER_MIN=${RATE_LIMIT_TENANT_TOKENS_PER_MIN:-50000}
      - USAGE_METERING_ENABLED=true
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./backend/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./backend/package.json

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile.dev
    container_name: acp-worker
    restart: unless-stopped
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?schema=public
      - REDIS_URL=redis://default:${REDIS_PASSWORD}@redis:6379
      - AI_SERVICE_URL=http://ai-service:8000
      - BULLMQ_CONCURRENCY=${BULLMQ_CONCURRENCY:-5}
    volumes:
      - ./worker:/app
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./worker/src
          target: /app/src
          ignore:
            - node_modules/
        - action: rebuild
          path: ./worker/package.json

  # ==========================================
  # 4. FRONTENDS (Next.js Admin)
  # ==========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: acp-frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_WS_URL=ws://localhost:3000
      - NEXT_PUBLIC_APP_NAME=${TENANT_APP_NAME:-ChatAdmin}
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./frontend/src/app
          target: /app/src/app
        - action: sync
          path: ./frontend/src/components
          target: /app/src/components

  widget:
    build:
      context: ./widget
      dockerfile: Dockerfile.dev
    container_name: acp-widget
    restart: unless-stopped
    ports:
      - "3002:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_WS_URL=ws://localhost:3000
      - VITE_WIDGET_MODE=development
    volumes:
      - ./widget:/app
      - /app/node_modules
    depends_on:
      - backend
    develop:
      watch:
        - action: sync
          path: ./widget/src
          target: /app/src
        - action: sync
          path: ./widget/public
          target: /app/public

  # ==========================================
  # 5. ADMIN & OBSERVABILITY TOOLS
  # ==========================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: acp-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@platform.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-adminpassword}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  redisinsight:
    image: redislabs/redisinsight:latest
    container_name: acp-redisinsight
    restart: unless-stopped
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data: